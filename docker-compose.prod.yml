# Production stack — runs Postgres, Redis, and the app together.
#
# ⚠️  Before starting, copy and fill in the env file:
#       cp .env.docker.example .env
#     The DATABASE_URL and REDIS_HOST in that file use Docker service names
#     (postgres / redis), not localhost.
#
# First-time setup:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec app npx prisma db seed
#
# Day-to-day:
#   docker compose -f docker-compose.prod.yml up -d        # start
#   docker compose -f docker-compose.prod.yml down         # stop
#   docker compose -f docker-compose.prod.yml logs -f app  # tail logs
#   docker compose -f docker-compose.prod.yml pull && \
#     docker compose -f docker-compose.prod.yml up -d --build  # deploy update

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: routine
      POSTGRES_USER: routine
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not exposed to host — only the app container can reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routine -d routine"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Not exposed to host — only the app container can reach it.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DB/Redis connection to use Docker service names, not localhost.
      # These two lines are the only values that differ from .env.server.example.
      DATABASE_URL: postgresql://routine:${DB_PASSWORD}@postgres:5432/routine
      REDIS_HOST: redis
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
