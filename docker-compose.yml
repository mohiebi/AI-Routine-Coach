# Local development helper — starts Postgres and Redis so you can run
# the NestJS app outside Docker with `npm run start:dev`.
#
# Usage:
#   docker compose up -d        # start DB + Redis
#   npm run start:dev           # run the app locally
#   docker compose down         # stop everything

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routine
      POSTGRES_USER: routine
      POSTGRES_PASSWORD: routine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routine -d routine"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
